name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deployment at a time. A superseded run gets cancelled instead of racing a newer
  # build onto the single free tier instance.
  group: deploy-production
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PUBLISH_DIRECTORY: artifacts/publish

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # A failing test stops the deployment. Nothing reaches the site without passing here.
      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish the web application
        run: >
          dotnet publish src/NumberToWords.Api/NumberToWords.Api.csproj
          --configuration Release --no-build
          --output ${{ env.PUBLISH_DIRECTORY }}

      - name: Upload the published application
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: ${{ env.PUBLISH_DIRECTORY }}
          retention-days: 7

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    # The deployment target is set once, in the repository variables. Until then this job
    # skips instead of failing, so a fork or a fresh clone still gets a green build.
    if: vars.AZURE_WEBAPP_NAME != ''

    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Download the published application
        uses: actions/download-artifact@v4
        with:
          name: web-app
          path: ${{ env.PUBLISH_DIRECTORY }}

      - name: Deploy to App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIRECTORY }}

      # F1 has no Always On. The site sleeps when idle and the first request after a deploy
      # pays for the cold start. This wakes it and confirms the deployment actually serves.
      - name: Check the health endpoint
        run: |
          url="${{ steps.deploy.outputs.webapp-url }}/health"
          for attempt in $(seq 1 12); do
            status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$url" || echo "000")
            if [ "$status" = "200" ]; then
              echo "The site answered with 200 on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt returned $status. Waiting before the next one."
            sleep 15
          done
          echo "The site did not return 200 within the retry window."
          exit 1
